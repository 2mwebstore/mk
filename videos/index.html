<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V168 — Videos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161d3191;
    --panel:#12161D;
    --panel-2:#181D26;
    --line:#232933;
    --text:#F1F3F6;
    --muted:#7C8697;
    --signal:#5c55c0;
    --live:#FF4667;
  }
  html{ background:#2a3148 !important; }
  *{box-sizing:border-box;}
  html,body{background:radial-gradient(120% 60% at 50% 0%, #323a54, var(--ink) 55%); color:var(--text); font-family:'Inter',sans-serif; min-height:100%;}
  .font-display{font-family:'Rajdhani',sans-serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}

  .pulse-bars{display:inline-flex; align-items:flex-end; gap:2px; height:10px;}
  .pulse-bars span{width:2px; background:var(--live); display:inline-block; animation:pulse-bar 900ms ease-in-out infinite;}
  .pulse-bars span:nth-child(1){height:40%; animation-delay:0ms;}
  .pulse-bars span:nth-child(2){height:100%; animation-delay:120ms;}
  .pulse-bars span:nth-child(3){height:65%; animation-delay:240ms;}
  .pulse-bars span:nth-child(4){height:85%; animation-delay:360ms;}
  @keyframes pulse-bar{0%,100%{transform:scaleY(0.35); opacity:.7;} 50%{transform:scaleY(1); opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .pulse-bars span{animation:none; transform:scaleY(0.8);} }

  .chip{
    position:relative; overflow:hidden; color:var(--muted); white-space:nowrap;
    background:linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 2px 6px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.04);
    transition:color .25s ease, background .35s ease, border-color .25s ease, box-shadow .35s ease, transform .25s ease;
  }
  .chip::before{content:""; position:absolute; top:0; left:-120%; width:70%; height:100%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent); transform:skewX(-20deg); transition:left .6s ease; pointer-events:none;}
  .chip:hover::before{left:140%;}
  .chip:hover:not(.active){color:#fff; border-color:rgba(115,103,240,.65); background:linear-gradient(135deg, rgba(107,98,214,.25), rgba(92,85,192,.12)); box-shadow:0 6px 18px rgba(92,85,192,.25), 0 0 12px rgba(115,103,240,.15); transform:translateY(-2px) scale(1.02);}
  .chip:active{transform:translateY(0) scale(.96);}
  .chip.active{color:#fff; border-color:#8178ef; background:linear-gradient(135deg, #7168df 0%, #5c55c0 50%, #4942a5 100%); box-shadow:0 5px 5px rgba(92,85,192,.45), 0 0 10px rgba(115,103,240,.35), inset 0 1px 0 rgba(255,255,255,.25); transform:translateY(-1px);}
  .chip.active::after{content:""; position:absolute; inset:-2px; border-radius:inherit; border:1px solid rgba(255,255,255,.25); opacity:.7; animation:categoryGlow 1.8s ease-in-out infinite; pointer-events:none;}
  @keyframes categoryGlow{0%,100%{opacity:.35; box-shadow:0 0 0 rgba(115,103,240,0);} 50%{opacity:1; box-shadow:0 0 14px rgba(115,103,240,.45);}}
  @media (prefers-reduced-motion: reduce){ .chip, .chip::before, .chip.active::after{animation:none; transition:none;} }

  a:focus-visible, button:focus-visible{outline:2px solid var(--signal); outline-offset:2px;}

  .top-nav{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;padding:8px 12px;border-radius:999px;color:var(--muted);border:1px solid transparent;transition:.25s ease;}
  .top-nav:hover,.top-nav.active{color:#fff;background:rgba(113,104,223,.18);border-color:rgba(129,120,239,.35);box-shadow:0 0 18px rgba(92,85,192,.18);}

  .page-title{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.5rem; letter-spacing:.02em; color:var(--text);}

  /* ---- videos list ---- */
  .video-card{cursor:pointer; display:flex; align-items:center; gap:16px; padding:12px; border-radius:12px; transition:background .2s ease, transform .15s ease; text-decoration:none;    border: 1px solid var(--line);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .03);}
  .video-card:hover{background:rgba(255,255,255,.045); transform:translateX(2px);}
  .video-thumb{width:16rem; height:9rem; max-width:100%; flex-shrink:0; border-radius:10px; overflow:hidden; position:relative; background:#0d1117; border:1px solid var(--line); box-shadow:0 4px 14px rgba(0,0,0,.3);}
  .video-thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s ease;}
  .video-card:hover .video-thumb img{transform:scale(1.06);}
  .video-thumb .play-badge{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0); transition:background .2s ease;}
  .video-card:hover .play-badge{background:rgba(0,0,0,.3);}
  .play-badge svg{opacity:0; transform:scale(.8); transition:opacity .2s ease, transform .2s ease; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));}
  .video-card:hover .play-badge svg{opacity:1; transform:scale(1);}
  .video-info{min-width:0; flex:1;}
  .video-title{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:16px; line-height:1.35; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .video-card:hover .video-title{color:#fff;}
  .video-meta{display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap;}
  .video-views, .video-time{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted); display:inline-flex; align-items:center; gap:5px;}
  .meta-dot{width:3px; height:3px; border-radius:50%; background:var(--muted); flex-shrink:0;}
  .video-list{display:flex; flex-direction:column; gap:4px;}
  .video-list-divider{height:1px; background:var(--line); margin:2px 12px;}

  .load-more-btn{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:.08em; font-size:13px;}

  /* ---- infinite scroll ---- */
  #scrollSentinel{height:1px;}
  .scroll-status{display:flex; align-items:center; justify-content:center; gap:10px; padding:20px 0; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);}
  .spinner{width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.15); border-top-color:var(--signal); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none;} }

  @media (max-width: 640px){
    .video-card{align-items:flex-start; gap:12px; padding:10px 6px;}
    .video-thumb{width:9.5rem; height:6rem;}
    .video-title{font-size:13.5px; -webkit-line-clamp:3;}
    .video-views, .video-time{font-size:10.5px;}
  }
</style>
</head>
<body class="min-h-screen">

<header class="sticky top-0 z-40 backdrop-blur bg-[#161d3191] border-b" style="border-color:var(--line); box-shadow:0 4px 20px rgba(0,0,0,.25);">
  <div class="max-w-7xl mx-auto px-5 md:px-8 h-16 flex items-center">
    <div class="flex items-center gap-2 shrink-0">
      <img src="/v168.png" alt="V168" class="h-7 sm:h-8 md:h-10 w-auto rounded">
    </div>
    <nav class="ml-auto flex items-center gap-2">
      <a href="/" class="chip top-nav inline-flex items-center gap-2 shrink-0 backdrop-blur bg-[#161d3191]">
        <span class="pulse-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>LIVE</span>
      </a>
      <a href="/videos/" class="chip top-nav active inline-flex items-center gap-2 shrink-0 backdrop-blur bg-[#161d3191]" aria-label="Videos">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span>VIDEOS</span>
      </a>
      <a href="/fights/" class="chip top-nav inline-flex items-center gap-2 shrink-0 backdrop-blur bg-[#161d3191]" aria-label="List Fight">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path>
          <path d="M13 19l6-6"></path>
          <path d="M16 16l4 4"></path>
          <path d="M19 21l2-2"></path>
          <path d="M9.5 6.5L21 18v3h-3L6.5 9.5"></path>
        </svg>
        <span>LIST FIGHT</span>
      </a>
    </nav>
  </div>
</header>

<main class="max-w-7xl mx-auto px-5 md:px-8 pb-24 md:pb-0">
  <section class="pt-6">
    <h1 class="page-title mb-4">Videos</h1>
    <div id="videosGrid" class="video-list"></div>
    <div id="scrollSentinel"></div>
    <div id="scrollStatus" class="scroll-status" style="display:none;">
      <span class="spinner" aria-hidden="true"></span>
      <span id="scrollStatusText">Loading more…</span>
    </div>
  </section>
</main>

<script>
(function(){
  const VIDEOS_API_URL = 'https://cf88.me/api/channel'; // GET ?page=n -> { data: [...], last_page, ... }

  const videosGrid    = document.getElementById('videosGrid');
  const scrollSentinel = document.getElementById('scrollSentinel');
  const scrollStatus    = document.getElementById('scrollStatus');
  const scrollStatusText = document.getElementById('scrollStatusText');

  let page = 1;
  let lastPage = 1;
  let loading = false;
  let done = false;

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }

  // Parses either "YYYY-MM-DD HH:MM:SS" or ISO-with-Z timestamps.
  function parseApiDate(str){
    if (!str) return null;
    const iso = str.includes('T') ? str : str.replace(' ', 'T');
    const d = new Date(iso);
    return isNaN(d.getTime()) ? null : d;
  }

  function timeAgo(str){
    const d = parseApiDate(str);
    if (!d) return '';
    const seconds = Math.floor((Date.now() - d.getTime()) / 1000);
    if (seconds < 45) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    if (days < 7) return `${days}d ago`;
    const weeks = Math.floor(days / 7);
    if (weeks < 5) return `${weeks}w ago`;
    const months = Math.floor(days / 30);
    if (months < 12) return `${months}mo ago`;
    const years = Math.floor(days / 365);
    return `${years}y ago`;
  }

  function renderVideoCard(item){
    const card = document.createElement('a');
    card.className = 'video-card';
    card.href = `/video/?id=${encodeURIComponent(item.id)}`;
    card.innerHTML = `
      <div class="video-thumb">
        <img src="${item.photo || ''}" alt="${escapeHtml(item.title)}" loading="lazy">
        <div class="play-badge">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.45)"/><path d="M10 8l6 4-6 4V8z" fill="#fff"/></svg>
        </div>
      </div>
      <div class="video-info">
        <div class="video-title">${escapeHtml(item.title)}</div>
        <div class="video-meta">
          <span class="video-views">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            ${item.view ?? 0} views
          </span>
          <span class="meta-dot"></span>
          <span class="video-time">${timeAgo(item.created_at || item.date)}</span>
        </div>
      </div>
    `;
    return card;
  }

  function appendDivider(){
    const div = document.createElement('div');
    videosGrid.appendChild(div);
  }

  function fetchVideos(p){
    if (loading || done) return;
    loading = true;
    scrollStatus.style.display = 'flex';
    scrollStatusText.textContent = 'Loading more…';

    fetch(`${VIDEOS_API_URL}?page=${p}`)
      .then(res => res.json())
      .then(json => {
        const items = json.data || [];
        items.forEach(item => {
          if (videosGrid.children.length > 0) appendDivider();
          videosGrid.appendChild(renderVideoCard(item));
        });
        lastPage = json.last_page || p;
        page = p;

        if (page >= lastPage){
          done = true;
          scrollStatusText.textContent = 'No more videos';
          observer.disconnect();
          window.removeEventListener('scroll', nearSentinel);
          window.removeEventListener('touchmove', nearSentinel);
          window.removeEventListener('resize', nearSentinel);
        } else {
          scrollStatus.style.display = 'none';
        }
      })
      .catch(err => {
        console.error('Videos API error:', err);
        scrollStatusText.textContent = 'Failed to load — retrying on scroll';
      })
      .finally(() => { loading = false; });
  }

  // Auto-load the next page as the sentinel below the list scrolls into view.
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) fetchVideos(page + 1);
    });
  }, { root: null, rootMargin: '600px 0px', threshold: 0 });

  observer.observe(scrollSentinel);

  // Fallback for environments where IntersectionObserver doesn't fire
  // reliably (some mobile in-app WebViews — Telegram/Facebook/TikTok's
  // in-app browser — and iOS Safari during fast momentum scrolling can
  // miss it). Checks the sentinel's position directly on scroll/resize/
  // touch as a backup trigger; harmless no-op once the real observer is
  // working, since fetchVideos() already guards against duplicate calls.
  function nearSentinel(){
    if (done || loading) return;
    const rect = scrollSentinel.getBoundingClientRect();
    const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
    if (rect.top <= viewportHeight + 600) fetchVideos(page + 1);
  }
  window.addEventListener('scroll', nearSentinel, { passive: true });
  window.addEventListener('touchmove', nearSentinel, { passive: true });
  window.addEventListener('resize', nearSentinel);

  fetchVideos(1);
  // Covers the case where page 1's items don't fill the screen, so the
  // sentinel is already in view before any scroll happens.
  setTimeout(nearSentinel, 300);
})();
</script>

</body>
</html>
