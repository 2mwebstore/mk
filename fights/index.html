<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V168 — List Fight</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161d3191;
    --panel:#12161D;
    --panel-2:#181D26;
    --line:#232933;
    --text:#F1F3F6;
    --muted:#7C8697;
    --signal:#5c55c0;
    --live:#FF4667;
    --meron:#FF4141;
    --wala:#3B82F6;
  }
  html{ background:#2a3148 !important; }
  *{box-sizing:border-box;}
  html,body{background:radial-gradient(120% 60% at 50% 0%, #323a54, var(--ink) 55%); color:var(--text); font-family:'Inter','Noto Sans Khmer',sans-serif; min-height:100%;}
  .font-display{font-family:'Rajdhani',sans-serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}

  .pulse-bars{display:inline-flex; align-items:flex-end; gap:2px; height:10px;}
  .pulse-bars span{width:2px; background:var(--live); display:inline-block; animation:pulse-bar 900ms ease-in-out infinite;}
  .pulse-bars span:nth-child(1){height:40%; animation-delay:0ms;}
  .pulse-bars span:nth-child(2){height:100%; animation-delay:120ms;}
  .pulse-bars span:nth-child(3){height:65%; animation-delay:240ms;}
  .pulse-bars span:nth-child(4){height:85%; animation-delay:360ms;}
  @keyframes pulse-bar{0%,100%{transform:scaleY(0.35); opacity:.7;} 50%{transform:scaleY(1); opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .pulse-bars span{animation:none; transform:scaleY(0.8);} }

  .chip{
    position:relative; overflow:hidden; color:var(--muted); white-space:nowrap;
    background:linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 2px 6px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.04);
    transition:color .25s ease, background .35s ease, border-color .25s ease, box-shadow .35s ease, transform .25s ease;
  }
  .chip::before{content:""; position:absolute; top:0; left:-120%; width:70%; height:100%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent); transform:skewX(-20deg); transition:left .6s ease; pointer-events:none;}
  .chip:hover::before{left:140%;}
  .chip:hover:not(.active){color:#fff; border-color:rgba(115,103,240,.65); background:linear-gradient(135deg, rgba(107,98,214,.25), rgba(92,85,192,.12)); box-shadow:0 6px 18px rgba(92,85,192,.25), 0 0 12px rgba(115,103,240,.15); transform:translateY(-2px) scale(1.02);}
  .chip:active{transform:translateY(0) scale(.96);}
  .chip.active{color:#fff; border-color:#8178ef; background:linear-gradient(135deg, #7168df 0%, #5c55c0 50%, #4942a5 100%); box-shadow:0 5px 5px rgba(92,85,192,.45), 0 0 10px rgba(115,103,240,.35), inset 0 1px 0 rgba(255,255,255,.25); transform:translateY(-1px);}
  .chip.active::after{content:""; position:absolute; inset:-2px; border-radius:inherit; border:1px solid rgba(255,255,255,.25); opacity:.7; animation:categoryGlow 1.8s ease-in-out infinite; pointer-events:none;}
  @keyframes categoryGlow{0%,100%{opacity:.35; box-shadow:0 0 0 rgba(115,103,240,0);} 50%{opacity:1; box-shadow:0 0 14px rgba(115,103,240,.45);}}
  @media (prefers-reduced-motion: reduce){ .chip, .chip::before, .chip.active::after{animation:none; transition:none;} }

  a:focus-visible, button:focus-visible{outline:2px solid var(--signal); outline-offset:2px;}

  /* ---- floating glass footer nav (glow pill, icons + label, active = grey pill + red dot) ---- */
  .footer-nav-wrap{
    position:fixed; left:14px; right:14px; bottom:14px; z-index:50;
    display:flex; justify-content:center;
  }
  .footer-glass{
    display:grid; grid-template-columns:1fr 1fr 1fr; align-items:center; justify-items:center;
    width:100%; max-width:520px;
    padding:12px 20px;
    border-radius:999px;
    background:#12142a;
    border:1px solid rgba(129,120,239,.3);
    box-shadow:
      0 0 0 1px rgba(99,91,220,.18),
      0 0 26px 6px rgba(92,85,220,.32),
      0 14px 34px rgba(0,0,0,.55);
  }
  .footer-tab{
    display:flex; align-items:center; gap:6px;
    font-family:'Noto Sans Khmer','Rajdhani',sans-serif;
    font-weight:700; font-size:13px; letter-spacing:.01em;
    color:var(--muted); white-space:nowrap;
    padding:8px 6px; border-radius:999px; transition:.25s ease;
  }
  .footer-tab svg{width:16px; height:16px; flex-shrink:0;}
  .footer-tab .pulse-bars{height:12px;}
  .footer-tab.active{
    color:#fff; background:rgba(148,152,181,.32); padding:8px 16px;
  }

  .page-title{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:.02em; color:var(--text);}

  /* ---- today filter button ---- */
  .today-btn{
    display:inline-flex; align-items:center; gap:7px; flex-shrink:0;
    font-family:'Rajdhani','Noto Sans Khmer',sans-serif; font-weight:700; font-size:12px; letter-spacing:.04em;
    padding:8px 16px; border-radius:999px; color:var(--muted);
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
    cursor:pointer; transition:.25s ease; white-space:nowrap;
  }
  .today-btn:hover{color:#fff; border-color:rgba(129,120,239,.4);}
  .today-btn-dot{width:6px; height:6px; border-radius:999px; background:var(--muted); transition:.25s ease;}
  .today-btn.active{
    color:#fff; border-color:#8178ef;
    background:linear-gradient(135deg, #7168df 0%, #5c55c0 55%, #4942a5 100%);
    box-shadow:0 5px 14px rgba(92,85,192,.4), 0 0 10px rgba(115,103,240,.3);
  }
  .today-btn.active .today-btn-dot{background:#fff; box-shadow:0 0 6px rgba(255,255,255,.8);}

  /* ---- fight cards ---- */
  .fight-list{display:flex; flex-direction:column; gap:14px;}
  .fight-card{
    position:relative; border-radius:14px; padding:20px 24px 24px;
    /* background:linear-gradient(180deg, var(--panel), var(--panel-2)); */
    border:1px solid var(--line);
    box-shadow:0 6px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .fight-header{display:flex; align-items:center; gap:8px; margin-bottom:18px;}
  .fight-header .bar{width:3px; height:16px; border-radius:2px; background:var(--signal);}
  .fight-no{font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--text);}
  .fight-brand{font-family:'Rajdhani',sans-serif; font-weight:600; color:var(--muted);}
  .fight-time{margin-left:auto; font-family:'IBM Plex Mono',monospace; color:var(--muted);}

  .fight-row{display:grid; grid-template-columns:1fr 1fr 56px 1fr 1fr; align-items:center; gap:8px;}
  .fighter{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; min-width:0;}
  .fighter-avatar{width:clamp(38px, 3vw + 30px, 52px); height:clamp(38px, 3vw + 30px, 52px); border-radius:50%; overflow:hidden; flex-shrink:0;}
  .fighter-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .fighter-name{font-family:'Rajdhani',sans-serif; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}

  .score-col{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .score-label{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:.06em;}
  .score-label.meron{color:var(--meron);}
  .score-label.wala{color:var(--wala);}
  .score-value{font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .score-value.meron{color:var(--meron);}
  .score-value.wala{color:var(--wala);}

  .vs-badge{display:flex; align-items:center; justify-content:center;}
  .vs-badge svg{filter:drop-shadow(0 2px 6px rgba(255,120,60,.35));}

  .skeleton-card{height:150px; border-radius:14px; background:linear-gradient(90deg, rgba(255,255,255,.03) 25%, rgba(255,255,255,.07) 37%, rgba(255,255,255,.03) 63%); background-size:400% 100%; animation:skeletonShine 1.4s ease infinite;}
  @keyframes skeletonShine{0%{background-position:100% 0;} 100%{background-position:-100% 0;}}

  .fighter-avatar{cursor:pointer;}

  /* ---- fighter modal ---- */
  .fighter-modal-overlay{
    position:fixed; inset:0; z-index:100; display:none;
    align-items:center; justify-content:center;
    backdrop-filter:blur(6px);
    padding:24px;
  }
  .fighter-modal-overlay.open{display:flex;}
  .fighter-modal{
    position:relative;height:100%; max-width:900px; max-height:900px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
  }
  .fighter-modal img{
    height:100%; max-height:calc(100% - 90px); object-fit:contain;
    border-radius:16px; border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .fighter-modal-name{font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--text); text-align:center;}
  .fighter-modal-name.meron{color:var(--meron);}
  .fighter-modal-name.wala{color:var(--wala);}
  .fighter-modal-close{
    position:absolute; top:-4px; right:-4px; width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:var(--text);
    cursor:pointer; transition:background .2s ease;
  }
  .fighter-modal-close:hover{background:rgba(255,255,255,.18);}
  @media (max-width: 640px){
    .fighter-modal-overlay{padding:12px;}
    .fighter-modal-close{top:0; right:0;}
  }

  #scrollSentinel{height:1px;}
  .scroll-status{display:flex; align-items:center; justify-content:center; gap:10px; padding:20px 0; font-family:'IBM Plex Mono',monospace; color:var(--muted);}
  .spinner{width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.15); border-top-color:var(--signal); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none;} }

  @media (max-width: 640px){
    .fight-card{padding:14px 12px 16px;}
    .fight-row{grid-template-columns:1fr 1fr 40px 1fr 1fr; gap:4px;}
    .vs-badge svg{width:26px; height:26px;}
  }
  /* ---- language switch: centered flag, click to cycle, glass bg cycles by language ---- */
  .lang-switch{margin-left:auto;}
  .lang-btn{display:flex; align-items:center; justify-content:center; width:40px; height:40px;
    border-radius:999px; padding:0; border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    cursor:pointer; overflow:hidden; position:relative;
    transition:background .4s ease, border-color .4s ease, transform .2s ease;}
  .lang-btn:hover{border-color:rgba(129,120,239,.35);}
  .lang-btn:active{transform:scale(.92);}
  .lang-btn[data-active-lang="km"]{background: rgba(113, 104, 223, .2);border: 1px solid rgba(129, 120, 239, .35);box-shadow: 0 0 18px rgba(92, 85, 192, .25);}
  .lang-btn[data-active-lang="en"]{background: rgba(113, 104, 223, .2);border: 1px solid rgba(129, 120, 239, .35);box-shadow: 0 0 18px rgba(92, 85, 192, .25);}
  .lang-flag{font-size:18px; line-height:1; display:block;}
  .lang-btn.cycling .lang-flag{animation:langFlip .4s ease;}
  @keyframes langFlip{
    0%{transform:rotateY(0deg) scale(1);}
    50%{transform:rotateY(90deg) scale(.6); opacity:.4;}
    100%{transform:rotateY(0deg) scale(1);}
  }
</style>
</head>
<body class="min-h-screen">
<script src="/lang.js"></script>

<header class="sticky top-0 z-40 backdrop-blur bg-[#161d3191] border-b" style="border-color:var(--line); box-shadow:0 4px 20px rgba(0,0,0,.25);">
  <div class="max-w-7xl mx-auto px-5 md:px-8 h-16 flex items-center">
    <div class="flex items-center gap-2 shrink-0">
      <img src="/v168.png" alt="V168" class="h-7 sm:h-8 md:h-10 w-auto rounded">
    </div>
    <div class="lang-switch" id="langSwitch">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Change language" data-active-lang="km">
        <span class="lang-flag" id="langFlag">🇰🇭</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-5 md:px-8 pb-28">
  <section class="pt-6">
    <div class="flex items-center justify-between gap-3 mb-4">
      <h1 class="page-title text-xl sm:text-2xl" data-i18n="fightTitle">បញ្ជីប្រគួត</h1>
      <button id="todayFilterBtn" type="button" class="today-btn active" aria-pressed="true">
        <span class="today-btn-dot" aria-hidden="true"></span>
        <span data-i18n="today">ថ្ងៃនេះ</span>
      </button>
    </div>
    <div id="fightList" class="fight-list"></div>
    <div id="scrollSentinel"></div>
    <div id="scrollStatus" class="scroll-status" style="display:none;">
      <span class="spinner" aria-hidden="true"></span>
      <span id="scrollStatusText" class="text-[11px] sm:text-xs" data-i18n="loadingMore">កំពុងផ្ទុកបន្ថែម…</span>
    </div>
  </section>
</main>

<div id="fighterModalOverlay" class="fighter-modal-overlay" aria-hidden="true">
  <div class="fighter-modal" role="dialog" aria-modal="true" aria-labelledby="fighterModalName">
    <button id="fighterModalClose" class="fighter-modal-close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <img id="fighterModalImg" src="" alt="">
    <div id="fighterModalName" class="fighter-modal-name"></div>
  </div>
</div>

<script>
(function(){
  const FIGHTS_API_URL = 'https://cf88.me/api/fight'; // GET ?page=n -> { data: [...], last_page, ... }

  const fightList      = document.getElementById('fightList');
  const scrollSentinel = document.getElementById('scrollSentinel');
  const scrollStatus    = document.getElementById('scrollStatus');
  const scrollStatusText = document.getElementById('scrollStatusText');
  const todayFilterBtn  = document.getElementById('todayFilterBtn');

  let page = 1;
  let lastPage = 1;
  let loading = false;
  let done = false;
  let todayOnly = true;

  // Compare a fight's date to "today" in Cambodia time (Asia/Phnom_Penh), not the browser's local time.
  const phnomPenhDateFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Phnom_Penh', year: 'numeric', month: '2-digit', day: '2-digit' });
  function isTodayInPhnomPenh(dateStr){
    const d = parseApiDate(dateStr);
    if (!d) return false;
    return phnomPenhDateFmt.format(d) === phnomPenhDateFmt.format(new Date());
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }

  function parseApiDate(str){
    if (!str) return null;
    const iso = str.includes('T') ? str : str.replace(' ', 'T');
    const d = new Date(iso);
    return isNaN(d.getTime()) ? null : d;
  }

  function timeAgo(str){
    const d = parseApiDate(str);
    if (!d) return '';
    const seconds = Math.floor((Date.now() - d.getTime()) / 1000);
    if (seconds < 45) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    if (days < 7) return `${days}d ago`;
    const weeks = Math.floor(days / 7);
    if (weeks < 5) return `${weeks}w ago`;
    const months = Math.floor(days / 30);
    if (months < 12) return `${months}mo ago`;
    const years = Math.floor(days / 365);
    return `${years}y ago`;
  }

  const DEFAULT_LEFT_IMAGE  = '/images/left.png';
  const DEFAULT_RIGHT_IMAGE = '/images/right.png';

  function renderFightCard(item){
    const card = document.createElement('div');
    card.className = 'fight-card';

    const redImage  = item.red_image  || DEFAULT_LEFT_IMAGE;
    const blueImage = item.blue_image || DEFAULT_RIGHT_IMAGE;

    card.innerHTML = `
      <div class="fight-header">
        <span class="bar"></span>
        <span class="fight-no text-xs sm:text-sm">No.${escapeHtml(item.no)}</span>
        <span class="fight-brand text-[11px] sm:text-sm">V168</span>
        <span class="fight-time text-[10px] sm:text-xs">${timeAgo(item.created_at)}</span>
      </div>
      <div class="fight-row">
        <div class="fighter">
          <div class="fighter-avatar" data-side="meron" role="button" tabindex="0" aria-label="View ${escapeHtml(item.red_fighter)}"><img src="${DEFAULT_LEFT_IMAGE}" alt="${escapeHtml(item.red_fighter)}" loading="lazy" onerror="this.src='${DEFAULT_LEFT_IMAGE}'"></div>
          <div class="fighter-name text-xs sm:text-sm">${escapeHtml(item.red_fighter)}</div>
        </div>
        <div class="score-col">
          <span class="score-label meron text-[11px] sm:text-[13px]" data-i18n="meron">${window.V168Lang.t('meron')}</span>
          <span class="score-value meron text-sm sm:text-lg">${escapeHtml(item.red_score)}</span>
        </div>
        <div class="vs-badge">
          <svg width="34" height="34" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="vsGrad${item.id}" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffb347"/>
                <stop offset="100%" stop-color="#ff4141"/>
              </linearGradient>
            </defs>
            <text x="12" y="17" text-anchor="middle" font-family="Rajdhani, sans-serif" font-weight="700" font-size="14" fill="url(#vsGrad${item.id})">VS</text>
          </svg>
        </div>
        <div class="score-col">
          <span class="score-label wala text-[11px] sm:text-[13px]" data-i18n="wala">${window.V168Lang.t('wala')}</span>
          <span class="score-value wala text-sm sm:text-lg">${escapeHtml(item.blue_score)}</span>
        </div>
        <div class="fighter">
          <div class="fighter-avatar" data-side="wala" role="button" tabindex="0" aria-label="View ${escapeHtml(item.blue_fighter)}"><img src="${DEFAULT_RIGHT_IMAGE}" alt="${escapeHtml(item.blue_fighter)}" loading="lazy" onerror="this.src='${DEFAULT_RIGHT_IMAGE}'"></div>
          <div class="fighter-name text-xs sm:text-sm">${escapeHtml(item.blue_fighter)}</div>
        </div>
      </div>
    `;

    const redAvatar  = card.querySelector('.fighter-avatar[data-side="meron"]');
    const blueAvatar = card.querySelector('.fighter-avatar[data-side="wala"]');

    const openRed  = () => openFighterModal({ image: redImage,  fallback: DEFAULT_LEFT_IMAGE,  name: item.red_fighter,  side: 'meron' });
    const openBlue = () => openFighterModal({ image: blueImage, fallback: DEFAULT_RIGHT_IMAGE, name: item.blue_fighter, side: 'wala'  });

    redAvatar.addEventListener('click', openRed);
    redAvatar.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openRed(); } });
    blueAvatar.addEventListener('click', openBlue);
    blueAvatar.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBlue(); } });

    return card;
  }

  // ---- fighter full-screen modal ----
  const fighterModalOverlay = document.getElementById('fighterModalOverlay');
  const fighterModalImg     = document.getElementById('fighterModalImg');
  const fighterModalName    = document.getElementById('fighterModalName');
  const fighterModalClose   = document.getElementById('fighterModalClose');

  function openFighterModal({ image, fallback, name, side }){
    fighterModalImg.src = image || fallback;
    fighterModalImg.alt = name || '';
    fighterModalImg.onerror = () => { fighterModalImg.onerror = null; fighterModalImg.src = fallback; };
    fighterModalName.textContent = name || '';
    fighterModalName.className = `fighter-modal-name text-lg sm:text-2xl ${side === 'meron' ? 'meron' : 'wala'}`;
    fighterModalOverlay.classList.add('open');
    fighterModalOverlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeFighterModal(){
    fighterModalOverlay.classList.remove('open');
    fighterModalOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  fighterModalClose.addEventListener('click', closeFighterModal);
  fighterModalOverlay.addEventListener('click', (e) => { if (e.target === fighterModalOverlay) closeFighterModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFighterModal(); });

  function fetchFights(p){
    if (loading || done) return;
    loading = true;
    scrollStatus.style.display = 'flex';
    scrollStatusText.textContent = window.V168Lang.t('loadingMore');
    loadPage(p);
  }

  // Loads a page and, when the "Today" filter is on and a page has no matches,
  // keeps pulling the next page automatically so the list doesn't look stuck empty.
  function loadPage(p){
    fetch(`${FIGHTS_API_URL}?page=${p}`)
      .then(res => res.json())
      .then(json => {
        const items = json.data || [];
        const visibleItems = todayOnly ? items.filter(item => isTodayInPhnomPenh(item.created_at)) : items;
        visibleItems.forEach(item => fightList.appendChild(renderFightCard(item)));
        lastPage = json.last_page || p;
        page = p;

        if (page >= lastPage){
          done = true;
          loading = false;
          const hasAny = fightList.children.length > 0;
          scrollStatus.style.display = hasAny ? 'none' : 'flex';
          scrollStatusText.textContent = (todayOnly && !hasAny)
            ? window.V168Lang.t('noFightsToday')
            : window.V168Lang.t('noMoreFights');
          observer.disconnect();
          return;
        }

        if (todayOnly && visibleItems.length === 0){
          loadPage(page + 1);
          return;
        }

        loading = false;
        scrollStatus.style.display = 'none';
      })
      .catch(err => {
        console.error('Fights API error:', err);
        loading = false;
        scrollStatusText.textContent = window.V168Lang.t('loadFailed');
      });
  }

  // Auto-load the next page as the sentinel below the list scrolls into view.
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) fetchFights(page + 1);
    });
  }, { root: null, rootMargin: '600px 0px', threshold: 0 });

  observer.observe(scrollSentinel);

  todayFilterBtn.addEventListener('click', () => {
    todayOnly = !todayOnly;
    todayFilterBtn.classList.toggle('active', todayOnly);
    todayFilterBtn.setAttribute('aria-pressed', todayOnly ? 'true' : 'false');

    // Reset pagination/list state and refetch from page 1 under the new filter.
    fightList.innerHTML = '';
    page = 1;
    lastPage = 1;
    done = false;
    loading = false;
    observer.observe(scrollSentinel);
    fetchFights(1);
  });

  fetchFights(1);
})();
</script>
