<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V168 — Video</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161d3191;
    --panel:#12161D;
    --panel-2:#181D26;
    --line:#232933;
    --text:#F1F3F6;
    --muted:#7C8697;
    --signal:#5c55c0;
    --live:#FF4667;
  }
  html{ background:#2a3148 !important; }
  *{box-sizing:border-box;}
  html,body{background:radial-gradient(120% 60% at 50% 0%, #323a54, var(--ink) 55%); color:var(--text); font-family:'Inter','Noto Sans Khmer',sans-serif; min-height:100%;}
  .font-display{font-family:'Rajdhani',sans-serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}

  .pulse-bars{display:inline-flex; align-items:flex-end; gap:2px; height:10px;}
  .pulse-bars span{width:2px; background:var(--live); display:inline-block; animation:pulse-bar 900ms ease-in-out infinite;}
  .pulse-bars span:nth-child(1){height:40%; animation-delay:0ms;}
  .pulse-bars span:nth-child(2){height:100%; animation-delay:120ms;}
  .pulse-bars span:nth-child(3){height:65%; animation-delay:240ms;}
  .pulse-bars span:nth-child(4){height:85%; animation-delay:360ms;}
  @keyframes pulse-bar{0%,100%{transform:scaleY(0.35); opacity:.7;} 50%{transform:scaleY(1); opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .pulse-bars span{animation:none; transform:scaleY(0.8);} }

  .chip{
    position:relative; overflow:hidden; color:var(--muted); white-space:nowrap;
    background:linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 2px 6px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.04);
    transition:color .25s ease, background .35s ease, border-color .25s ease, box-shadow .35s ease, transform .25s ease;
  }
  .chip::before{content:""; position:absolute; top:0; left:-120%; width:70%; height:100%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent); transform:skewX(-20deg); transition:left .6s ease; pointer-events:none;}
  .chip:hover::before{left:140%;}
  .chip:hover:not(.active){color:#fff; border-color:rgba(115,103,240,.65); background:linear-gradient(135deg, rgba(107,98,214,.25), rgba(92,85,192,.12)); box-shadow:0 6px 18px rgba(92,85,192,.25), 0 0 12px rgba(115,103,240,.15); transform:translateY(-2px) scale(1.02);}
  .chip:active{transform:translateY(0) scale(.96);}
  .chip.active{color:#fff; border-color:#8178ef; background:linear-gradient(135deg, #7168df 0%, #5c55c0 50%, #4942a5 100%); box-shadow:0 5px 5px rgba(92,85,192,.45), 0 0 10px rgba(115,103,240,.35), inset 0 1px 0 rgba(255,255,255,.25); transform:translateY(-1px);}
  .chip.active::after{content:""; position:absolute; inset:-2px; border-radius:inherit; border:1px solid rgba(255,255,255,.25); opacity:.7; animation:categoryGlow 1.8s ease-in-out infinite; pointer-events:none;}
  @keyframes categoryGlow{0%,100%{opacity:.35; box-shadow:0 0 0 rgba(115,103,240,0);} 50%{opacity:1; box-shadow:0 0 14px rgba(115,103,240,.45);}}
  @media (prefers-reduced-motion: reduce){ .chip, .chip::before, .chip.active::after{animation:none; transition:none;} }

  a:focus-visible, button:focus-visible{outline:2px solid var(--signal); outline-offset:2px;}

  /* ---- floating glass footer nav (glow pill, icons + label, active = grey pill + red dot) ---- */
  .footer-nav-wrap{
    position:fixed; left:14px; right:14px; bottom:14px; z-index:50;
    display:flex; justify-content:center;
  }
  .footer-glass{
    display:grid; grid-template-columns:1fr 1fr 1fr; align-items:center; justify-items:center;
    width:100%; max-width:520px;
    padding:12px 20px;
    border-radius:999px;
    background:#12142a;
    border:1px solid rgba(129,120,239,.3);
    box-shadow:
      0 0 0 1px rgba(99,91,220,.18),
      0 0 26px 6px rgba(92,85,220,.32),
      0 14px 34px rgba(0,0,0,.55);
  }
  .footer-tab{
    display:flex; align-items:center; gap:6px;
    font-family:'Noto Sans Khmer','Rajdhani',sans-serif;
    font-weight:700; font-size:13px; letter-spacing:.01em;
    color:var(--muted); white-space:nowrap;
    padding:8px 6px; border-radius:999px; transition:.25s ease;
  }
  .footer-tab svg{width:16px; height:16px; flex-shrink:0;}
  .footer-tab .pulse-bars{height:12px;}
  .footer-tab.active{
    color:#fff; background:rgba(148,152,181,.32); padding:8px 16px;
  }

  .card{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--line); box-shadow:0 6px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);}

  /* --- Back button (icon box + title), matched to reference screenshot --- */
  .back-row{display:flex; align-items:center; gap:14px;}
  .back-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:44px; height:44px; flex-shrink:0; border-radius:14px;
    /* background:linear-gradient(180deg, var(--panel), var(--panel-2)); */
    border:1px solid var(--line); color:var(--text); text-decoration:none;
    box-shadow:0 4px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease, transform .2s ease;
  }
  .back-btn svg{width:20px; height:20px;}
  .back-btn:hover{
    border-color:rgba(115,103,240,.6);
    background:linear-gradient(135deg, rgba(107,98,214,.3), rgba(92,85,192,.15));
    box-shadow:0 6px 16px rgba(92,85,192,.3), 0 0 12px rgba(115,103,240,.2);
    transform:translateX(-2px);
  }
  .back-btn:active{transform:translateX(-1px) scale(.94);}
  .back-title{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.5rem; letter-spacing:.01em; color:var(--text);}

  #playerWrap{position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden;}
  #playerWrap video{width:100%; height:100%; object-fit:contain; background:#000;}

  .detail-title{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.35rem; line-height:1.35; color:var(--text);}
  .detail-meta{display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .detail-meta span{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:5px;}
  .meta-dot{width:3px; height:3px; border-radius:50%; background:var(--muted); flex-shrink:0;}
  .detail-desc{margin-top:16px; padding-top:16px; border-top:1px solid var(--line); font-size:14px; line-height:1.6; color:var(--muted);}

  .skeleton{background:linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.09) 37%, rgba(255,255,255,.04) 63%); background-size:400% 100%; animation:skeletonShine 1.4s ease infinite; border-radius:8px;}
  @keyframes skeletonShine{0%{background-position:100% 0;} 100%{background-position:-100% 0;}}

  .state-msg{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:1rem; color:var(--muted); text-align:center; padding:40px 0;}

  @media (max-width: 640px){
    .detail-title{font-size:1.1rem;}
    .back-title{font-size:1.25rem;}
    .back-btn{width:40px; height:40px; border-radius:12px;}
  }
  /* ---- language switch: centered flag, click to cycle, glass bg cycles by language ---- */
  .lang-switch{margin-left:auto;}
  .lang-btn{display:flex; align-items:center; justify-content:center; width:40px; height:40px;
    border-radius:999px; padding:0; border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    cursor:pointer; overflow:hidden; position:relative;
    transition:background .4s ease, border-color .4s ease, transform .2s ease;}
  .lang-btn:hover{border-color:rgba(129,120,239,.35);}
  .lang-btn:active{transform:scale(.92);}
  .lang-btn[data-active-lang="km"]{background: rgba(113, 104, 223, .2);border: 1px solid rgba(129, 120, 239, .35);box-shadow: 0 0 18px rgba(92, 85, 192, .25);}
  .lang-btn[data-active-lang="en"]{background: rgba(113, 104, 223, .2);border: 1px solid rgba(129, 120, 239, .35);box-shadow: 0 0 18px rgba(92, 85, 192, .25);}
  .lang-flag{font-size:18px; line-height:1; display:block;}
  .lang-btn.cycling .lang-flag{animation:langFlip .4s ease;}
  @keyframes langFlip{
    0%{transform:rotateY(0deg) scale(1);}
    50%{transform:rotateY(90deg) scale(.6); opacity:.4;}
    100%{transform:rotateY(0deg) scale(1);}
  }
</style>
</head>
<body class="min-h-screen">
<script src="/lang.js"></script>

<header class="sticky top-0 z-40 backdrop-blur bg-[#161d3191] border-b" style="border-color:var(--line); box-shadow:0 4px 20px rgba(0,0,0,.25);">
  <div class="max-w-7xl mx-auto px-5 md:px-8 h-16 flex items-center">
    <div class="flex items-center gap-2 shrink-0">
      <img src="/v168.png" alt="V168" class="h-7 sm:h-8 md:h-10 w-auto rounded">
    </div>
    <div class="lang-switch" id="langSwitch">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Change language" data-active-lang="km">
        <span class="lang-flag" id="langFlag">🇰🇭</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-4xl mx-auto px-5 md:px-8 pb-28 pt-6">
  <div class="back-row mb-5">
    <a href="/videos/" class="back-btn" aria-label="Back to videos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <span class="back-title" data-i18n="videosTitle">វីដេអូ</span>
  </div>

  <div id="content" class="mt-4">
    <div id="playerWrap" class="skeleton"></div>
    <div class="state-msg" data-i18n="loadingVideo">កំពុងផ្ទុកវីដេអូ…</div>
  </div>
</main>

<script>
(function(){
  const API_BASE = 'https://cf88.me/api/channel';

  const content = document.getElementById('content');

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }

  function parseApiDate(str){
    if (!str) return null;
    const iso = str.includes('T') ? str : str.replace(' ', 'T');
    const d = new Date(iso);
    return isNaN(d.getTime()) ? null : d;
  }

  function timeAgo(str){
    const d = parseApiDate(str);
    if (!d) return '';
    const seconds = Math.floor((Date.now() - d.getTime()) / 1000);
    if (seconds < 45) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    if (days < 7) return `${days}d ago`;
    const weeks = Math.floor(days / 7);
    if (weeks < 5) return `${weeks}w ago`;
    const months = Math.floor(days / 30);
    if (months < 12) return `${months}mo ago`;
    const years = Math.floor(days / 365);
    return `${years}y ago`;
  }

  function renderVideo(item){
    content.innerHTML = `
      <div id="playerWrap" class="card">
        <video src="${item.video || ''}" controls autoplay playsinline poster="${item.photo || ''}"></video>
      </div>
      <h1 class="detail-title mt-4">${escapeHtml(item.title)}</h1>
      <div class="detail-meta">
        <span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          ${item.view ?? 0} <span data-i18n="views">${window.V168Lang.t('views')}</span>
        </span>
        <span class="meta-dot"></span>
        <span>${timeAgo(item.created_at || item.date)}</span>
      </div>
      ${item.detail ? `<div class="detail-desc">${escapeHtml(item.detail)}</div>` : ''}
    `;
  }

  function renderError(message){
    content.innerHTML = `<div class="state-msg">${escapeHtml(message)}</div>`;
  }

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id){
    renderError('No video specified.');
    return;
  }

  fetch(`${API_BASE}/${encodeURIComponent(id)}`)
    .then(res => {
      if (!res.ok) throw new Error('Request failed');
      return res.json();
    })
    .then(json => {
      // API returns either a single object or an array containing one object.
      const item = Array.isArray(json) ? json[0] : (json.data ?? json);
      if (!item) throw new Error('Not found');
      renderVideo(item);
    })
    .catch(err => {
      console.error('Video API error:', err);
      renderError('This video could not be loaded.');
    });
})();
</script>

<div class="footer-nav-wrap">
  <nav class="footer-glass">
    <a href="/" class="footer-tab">
      <span class="pulse-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <span data-i18n="live">ផ្សាយផ្ទាល់</span>
    </a>
    <a href="/videos/" class="footer-tab active" aria-label="Videos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      <span data-i18n="videos">វីដេអូ</span>
    </a>
    <a href="/fights/" class="footer-tab" aria-label="List Fight">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path>
        <path d="M13 19l6-6"></path>
        <path d="M16 16l4 4"></path>
        <path d="M19 21l2-2"></path>
        <path d="M9.5 6.5L21 18v3h-3L6.5 9.5"></path>
      </svg>
      <span data-i18n="fight">បញ្ជីប្រគួត</span>
    </a>
  </nav>
</div>

</body>
</html>
